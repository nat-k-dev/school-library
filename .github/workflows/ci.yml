name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: node inject-env.js
        env:
          NG_APP_FIREBASE_API_KEY: ci
          NG_APP_FIREBASE_AUTH_DOMAIN: ci
          NG_APP_FIREBASE_PROJECT_ID: ci
          NG_APP_FIREBASE_STORAGE_BUCKET: ci
          NG_APP_FIREBASE_MESSAGING_SENDER_ID: ci
          NG_APP_FIREBASE_APP_ID: ci
          NG_APP_USE_EMULATORS: 'false'
      - run: npm run build
